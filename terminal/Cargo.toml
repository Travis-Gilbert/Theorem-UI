[package]
name = "theorem-terminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "The agent terminal drawer's TUI: Ratatui on Ratzilla's DOM backend, compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
ratzilla = "0.3.1"
ratatui = { version = "0.30.1", default-features = false, features = ["unstable-rendered-line-info"] }
tui-markdown = { version = "0.3.12", default-features = false }
tui-input = { version = "0.15.5", default-features = false }
# Pinned to the installed wasm-bindgen CLI, which must match exactly.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
# Ratzilla's web-sys, plus the events the frame loop listens for and sends.
web-sys = { version = "0.3", features = ["Event", "EventTarget"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A dependency takes a critical section; wasm32 here is single-threaded, so std's is enough.
critical-section = { version = "1.2", features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
