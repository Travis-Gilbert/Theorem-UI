[package]
name = "theorem-desktop-protocol"
version = "0.1.0"
edition = "2024"
description = "Messages between the desktop host, the local server and the page. TypeScript bindings come from ts-rs."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
