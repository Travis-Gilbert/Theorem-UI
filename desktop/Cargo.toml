[package]
name = "theorem-desktop"
version = "0.1.0"
edition = "2024"
description = "Theorem UI's desktop host: a GPUI Kit app that shows the React app in Servo and runs the local server."
license = "MIT"
publish = false

[[bin]]
name = "theorem"
path = "src/main.rs"

# Its own workspace: libservo is in this graph, and nothing else should pay for it.
[workspace]
members = ["protocol"]

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
# Theorem's fork of Servo 0.7 (branch servo07-browser-20261013, base v0.7.0).
# Same revision and features as Theorem's own consumer in apps/browser.
servo = { git = "https://github.com/Travis-Gilbert/servo", rev = "b9d6db9eb26409c2bebab03cb8845be616d4df92", features = ["webcrypto", "webgl", "brotli-compression-stream"] }
anyhow = "1"
dirs = "6"
dpi = "0.1"
euclid = "0.22"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
log = "0.4"
notify-rust = "4.18"
raw-window-handle = "0.6"
# Servo's graph links more than one rustls provider; main installs ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
theorem-desktop-protocol = { path = "protocol" }
url = "2"
# Theorem's parented child view, vendored: see vendor/webview-surface/THEOREM-VENDOR.md.
webview-surface = { path = "vendor/webview-surface" }
which = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
security-framework = "3"

[dev-dependencies]
# Headless windows and simulated prompts for #[gpui_kit::test], whose expansion
# names the `gpui` crate. GPUI Kit's own test-support feature cannot resolve:
# it weakly names gpui-fast 0.1.10, which conflicts with the locked GPUI crates.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[profile.dev]
# Servo is unusably slow unoptimized; optimize dependencies, keep the host debuggable.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# See vendor/zed-font-kit/THEOREM-PATCH.md: freetype-sys 0.23 to match Servo.
zed-font-kit = { path = "vendor/zed-font-kit" }
